<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d42a20">
  <title>FindMe: Emergency Help</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .hero { text-align: center; margin: 8px 0 20px; }
    .hero h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.02em; }
    .hero p { margin: 0; color: var(--muted); }

    .types { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .type {
      appearance: none; font: inherit; font-weight: 650; font-size: 0.9rem;
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .type[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

    .sos-zone { display: grid; place-items: center; margin: 8px 0 24px; }
    .sos {
      width: min(68vw, 240px); aspect-ratio: 1; border-radius: 50%;
      border: 0; cursor: pointer; color: #fff;
      font: 900 2.6rem/1 system-ui, sans-serif; letter-spacing: 0.04em;
      background: radial-gradient(circle at 35% 30%, #ff6a5f, var(--red) 55%, var(--red-dark));
      box-shadow: 0 0 0 10px var(--red-soft), 0 18px 40px rgb(212 42 32 / 0.35);
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sos:active { transform: scale(0.97); }
    .sos small { display: block; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; margin-top: 8px; opacity: 0.9; }
    .sos.counting { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 22px var(--red-soft), 0 18px 40px rgb(212 42 32 / 0.35); } }
    @media (prefers-reduced-motion: reduce) { .sos.counting { animation: none; } }

    .status { text-align: center; min-height: 1.5em; font-weight: 650; margin-bottom: 16px; }

    .result { display: none; }
    .result.show { display: block; }
    .result .big { font-size: 1.5rem; margin: 6px 0 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    details { margin-top: 20px; }
    summary { cursor: pointer; font-weight: 650; color: var(--muted); }
    .settings { display: grid; gap: 12px; margin-top: 12px; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-dot"></span>FindMe</a>
    <nav class="nav">
      <a href="/" aria-current="page">Smartphone</a>
      <a href="/keypad">Keypad phone</a>
      <a href="/dashboard">Responders</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Need help now?</h1>
      <p>Press the button. We send your exact postcode to responders.</p>
    </section>

    <div class="types" role="group" aria-label="Type of emergency">
      <button class="type" data-type="attack" aria-pressed="true">Attack / Kidnap</button>
      <button class="type" data-type="fire" aria-pressed="false">Fire</button>
      <button class="type" data-type="medical" aria-pressed="false">Medical</button>
      <button class="type" data-type="accident" aria-pressed="false">Accident</button>
      <button class="type" data-type="other" aria-pressed="false">Other</button>
    </div>

    <div class="sos-zone">
      <button class="sos" id="sos" aria-describedby="status">HELP<small>TAP TO SEND</small></button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section class="card result" id="result" aria-live="polite">
      <span class="badge green">Alert sent</span>
      <div class="big postcode" id="r-code"></div>
      <div id="r-place"></div>
      <p class="muted small" id="r-meta"></p>
      <div class="row">
        <a class="btn" id="r-family" href="#">Text my family</a>
        <a class="btn" href="/dashboard">See responder view</a>
      </div>
    </section>

    <details>
      <summary>Settings</summary>
      <div class="settings">
        <label class="field">Your phone number (so responders can call you)
          <input type="tel" id="phone" placeholder="0803 000 0000" autocomplete="tel">
        </label>
        <label class="check"><input type="checkbox" id="demo">
          <span>Demo location: pretend I'm in Abuja (test postcodes only cover a few FCT buildings)</span>
        </label>
      </div>
    </details>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };

    let type = 'attack';
    document.querySelectorAll('.type').forEach((b) => b.addEventListener('click', () => {
      type = b.dataset.type;
      document.querySelectorAll('.type').forEach((x) => x.setAttribute('aria-pressed', x === b));
    }));

    $('phone').value = store.get('findme.phone') || '';
    $('phone').addEventListener('change', (e) => store.set('findme.phone', e.target.value));
    $('demo').checked = store.get('findme.demo') !== '0';
    $('demo').addEventListener('change', (e) => store.set('findme.demo', e.target.checked ? '1' : '0'));

    const sos = $('sos');
    let timer = null;

    function resetButton() {
      clearInterval(timer);
      timer = null;
      sos.classList.remove('counting');
      sos.innerHTML = 'HELP<small>TAP TO SEND</small>';
    }

    // Tap starts a 3-second countdown; tapping again cancels (stops accidental alerts).
    sos.addEventListener('click', () => {
      if (timer) {
        resetButton();
        $('status').textContent = 'Cancelled.';
        return;
      }
      let n = 3;
      sos.classList.add('counting');
      sos.innerHTML = `${n}<small>TAP TO CANCEL</small>`;
      $('status').textContent = 'Sending in 3 seconds…';
      timer = setInterval(() => {
        n -= 1;
        if (n > 0) {
          sos.innerHTML = `${n}<small>TAP TO CANCEL</small>`;
          $('status').textContent = `Sending in ${n} second${n > 1 ? 's' : ''}…`;
        } else {
          resetButton();
          send();
        }
      }, 1000);
    });

    function locate() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
          (p) => resolve(p.coords),
          () => resolve(null),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 },
        );
      });
    }

    async function send() {
      sos.disabled = true;
      $('status').textContent = 'Finding your location…';
      const demo = $('demo').checked;
      const coords = demo ? null : await locate();
      if (!demo && !coords) $('status').textContent = 'Could not get GPS. Sending demo location…';
      else $('status').textContent = 'Sending alert…';

      try {
        const res = await fetch('/api/alert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type,
            phone: $('phone').value,
            demo: demo || !coords,
            lat: coords?.latitude,
            lng: coords?.longitude,
            accuracy: coords?.accuracy,
          }),
        });
        if (!res.ok) throw new Error();
        const { alert, summary } = await res.json();
        show(alert, summary);
        $('status').textContent = 'Help is on the way. Stay safe.';
      } catch {
        $('status').textContent = 'Could not send. Check your connection, or dial 112.';
      } finally {
        sos.disabled = false;
      }
    }

    function show(alert, summary) {
      const p = alert.postcode;
      const loc = alert.location;
      $('r-code').textContent = p?.display || 'No postcode nearby';
      $('r-place').textContent = [p?.names?.lga, p?.names?.state].filter(Boolean).join(', ') || 'Location sent as GPS coordinates';
      $('r-meta').textContent = `Alert ${alert.id} · ${alert.typeLabel}` +
        (loc.simulated ? ' · demo location' : loc.accuracy_m ? ` · GPS ±${loc.accuracy_m}m` : '');
      const map = `https://maps.google.com/?q=${loc.lat},${loc.lng}`;
      $('r-family').href = `sms:?&body=${encodeURIComponent(`I need help! ${summary}. ${map}`)}`;
      $('result').classList.add('show');
    }
  </script>
</body>
</html>
